<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Same Request, Three Robots</title>
<script>/* Embedded on the project page: follow the page's theme (system unless the page sets data-theme), hide the gallery link and own header. */
(function(){try{if(window.self===window.top)return;var d=document.documentElement;d.classList.add('embedded');
function sync(){try{var t=window.parent.document.documentElement.getAttribute('data-theme');if(t==='light'||t==='dark')d.setAttribute('data-theme',t);else d.removeAttribute('data-theme');}catch(e){}}
sync();
try{new MutationObserver(sync).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
window.addEventListener('message',function(e){if(e.source===window.parent&&e.data&&e.data.type==='pcn-theme')sync();});
}catch(e){}})();
</script>
<style>.embedded a.back{display:none}.embedded .head > div:first-child{display:none}.embedded .head{margin-top:0}.idea,.mood{display:none!important}
.msg .who .mface{width:18px;height:18px;vertical-align:-5px;margin-left:5px}
.msg .who .mbot{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.msg.user .who{display:flex!important;justify-content:flex-end;align-items:center;gap:0}
.msg.user .who .st{font-size:10px;letter-spacing:.04em;opacity:.95}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaeeec; --grid:rgba(23,40,34,.055); --panel:#ffffff; --panel-2:#f4f6f5;
  --ink:#16201c; --muted:#5a6762; --line:#cdd5d1; --line-2:#e1e6e3;
  --wall:#27322e; --fl-bath:#dbebee; --fl-bath-tile:#c9dfe3; --fl-bed:#efe7d9; --fl-hall:#e4e8e6;
  --furn:#c3ccc8; --furn-2:#d8dedb; --mirror:#7fc4d8;
  --cab-white:#f8f8f6; --cab-wood:#7a4a2b; --cab-edge:#3b3b38; --tv:#121514;
  --l1:#b8720b; --l2:#2f63ad; --l3:#0b8378;
  --wrong:#cf3434; --right:#178f4b; --cross:#ee8a00;
  --bub-robot:#edf1ef; --bub-user:#e3ecf8; --bub-user-ink:#1b2b44;
  --m0:#2f9e5b; --m1:#d3a018; --m2:#e07b16; --m3:#d23a3a; --face-ink:#16201c;
  --focus:#0b6fd6; --btn:#16201c; --btn-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1312; --grid:rgba(220,235,228,.045); --panel:#161d1b; --panel-2:#1c2522;
    --ink:#e2eae6; --muted:#93a29c; --line:#2d3935; --line-2:#24302c;
    --wall:#c8d3ce; --fl-bath:#1a2a2e; --fl-bath-tile:#213439; --fl-bed:#2a251d; --fl-hall:#1f2624;
    --furn:#3a4642; --furn-2:#2f3936; --mirror:#4aa6c0;
    --cab-white:#e9ebe8; --cab-wood:#9a6038; --cab-edge:#0b0d0c; --tv:#050606;
    --l1:#e3a33c; --l2:#6d9ce4; --l3:#36c1b2;
    --wrong:#f06262; --right:#3fcf7d; --cross:#ffa53a;
    --bub-robot:#212b28; --bub-user:#1d2b40; --bub-user-ink:#dbe7fa;
    --m0:#3fbf73; --m1:#e6b83a; --m2:#f0913a; --m3:#f06262; --face-ink:#0e1312;
    --focus:#6fb2ff; --btn:#e2eae6; --btn-ink:#0e1312;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1312; --grid:rgba(220,235,228,.045); --panel:#161d1b; --panel-2:#1c2522;
  --ink:#e2eae6; --muted:#93a29c; --line:#2d3935; --line-2:#24302c;
  --wall:#c8d3ce; --fl-bath:#1a2a2e; --fl-bath-tile:#213439; --fl-bed:#2a251d; --fl-hall:#1f2624;
  --furn:#3a4642; --furn-2:#2f3936; --mirror:#4aa6c0;
  --cab-white:#e9ebe8; --cab-wood:#9a6038; --cab-edge:#0b0d0c; --tv:#050606;
  --l1:#e3a33c; --l2:#6d9ce4; --l3:#36c1b2;
  --wrong:#f06262; --right:#3fcf7d; --cross:#ffa53a;
  --bub-robot:#212b28; --bub-user:#1d2b40; --bub-user-ink:#dbe7fa;
  --m0:#3fbf73; --m1:#e6b83a; --m2:#f0913a; --m3:#f06262; --face-ink:#0e1312;
  --focus:#6fb2ff; --btn:#e2eae6; --btn-ink:#0e1312;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{
  max-width:1360px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-top:14px; padding-bottom:40px;
}
.back{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.back:hover{color:var(--ink);border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:14px 0 14px}
h1{font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.style-cap{margin:6px 0 0;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);letter-spacing:.02em}
.request{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%}
.request .lbl{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.request q{font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:1.15rem}
.request .note{font-size:12.5px;color:var(--muted)}

/* console */
.console{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.console-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font:600 13px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;padding:8px 12px;border-radius:6px;cursor:pointer;min-height:34px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.clock{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.spd{display:inline-flex;gap:4px}
.spd .btn{padding:8px 9px}
.clock b{color:var(--ink);font-weight:600;display:inline-block;min-width:4.2ch;text-align:right}
.phases{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.phase{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.phase.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.track{position:relative;height:6px;background:var(--line-2);border-radius:3px;margin:12px 0 18px}
.track .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);border-radius:3px}
.track .tick{position:absolute;top:-4px;width:2px;height:14px;transform:translateX(-1px);background:var(--c)}
.track .tick span{position:absolute;top:15px;left:50%;transform:translateX(-50%);font:600 10px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--c);white-space:nowrap}

/* lanes */
.lanes{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:980px){.lanes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.lane::before{content:"";display:block;height:4px;background:var(--acc)}
.lane-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px 8px;align-items:start}
.lane-id{font:600 10.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:var(--acc);margin-bottom:5px}
.lane h2{margin:0;font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.18rem;line-height:1.15}
.lane h2 .tag{font:500 11px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--muted);border:1px solid var(--line);padding:2px 5px;border-radius:4px;vertical-align:3px;margin-left:4px}
.idea{margin:3px 0 0;font-size:13px;color:var(--muted)}
.mood{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.mood .who{font:500 9.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.face{width:30px;height:30px;display:block}
.face .bg{fill:var(--m0);transition:fill .3s}
.face .ft{fill:none;stroke:var(--face-ink);stroke-width:1.6;stroke-linecap:round}
.face .eye{fill:var(--face-ink)}
.mood[data-l="1"] .face .bg{fill:var(--m1)}
.mood[data-l="2"] .face .bg{fill:var(--m2)}
.mood[data-l="3"] .face .bg{fill:var(--m3)}
.mood-l{font:600 10.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.burst{position:absolute;top:100%;right:-2px;margin-top:6px;z-index:5;white-space:nowrap;background:var(--m3);color:#fff;font:700 13px/1 "IBM Plex Sans Condensed","Arial Narrow",sans-serif;letter-spacing:.02em;padding:7px 10px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.burst::before{content:"";position:absolute;bottom:100%;right:22px;border:6px solid transparent;border-bottom-color:var(--m3)}
.burst[hidden]{display:none}

.mapbox{position:relative;margin:0 12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--fl-hall)}
.map{display:block;width:100%;height:auto}
.map .fl-bath{fill:var(--fl-bath)} .map .fl-bed{fill:var(--fl-bed)} .map .fl-hall{fill:var(--fl-hall)}
.map .tile{stroke:var(--fl-bath-tile);stroke-width:.6}
.map .wall{fill:none;stroke:var(--wall);stroke-width:3;stroke-linecap:square}
.map .furn{fill:var(--furn)} .map .furn2{fill:var(--furn-2)}
.map .mirror{fill:var(--mirror)}
.map .rl{font:600 6.4px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;fill:var(--muted)}
.map .cab rect.body{stroke:var(--cab-edge);stroke-width:.8;transition:opacity .3s}
.map .cab.white rect.body{fill:var(--cab-white)} .map .cab.wood rect.body{fill:var(--cab-wood)}
.map .cab .tv{fill:var(--tv)}
.map .cab .lbl{font:700 9px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;fill:var(--muted);text-anchor:middle}
.map .cab.found .lbl{fill:var(--acc)}
.map .cab .ring{fill:none;stroke:var(--acc);stroke-width:1.6;opacity:0}
.map .cab.found .ring{opacity:.9}
.map .cab .xx{stroke:var(--cross);stroke-width:3;stroke-linecap:round;opacity:0}
.map .cab.crossed .xx{opacity:1}
.map .cab.crossed rect.body{opacity:.45}
.map .cab.chosen .ring{stroke-width:2.6;opacity:1;stroke-dasharray:none}
.map .cab.rev-wrong .ring{stroke:var(--wrong);opacity:1;stroke-dasharray:none}
.map .cab.rev-right .ring{stroke:var(--right);opacity:1;stroke-dasharray:none}
.map .cab .tgt{font:700 6.5px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;fill:var(--right);opacity:0}
.map .cab.rev-right .tgt{opacity:1}
.map .ping{fill:none;stroke:var(--acc);stroke-width:1.4}
.map .trail{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-dasharray:2.5 2.5;opacity:.75;stroke-linejoin:round}
.map .bot circle{fill:var(--acc);stroke:var(--panel);stroke-width:1.8}
.map .bot path{fill:var(--panel)}
.map .dock{fill:none;stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2}
.status{margin:6px 12px 0;display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font:500 11.5px/1.25 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;min-height:2.1em}
.status .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.lane.live .status .dot{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-7deg) scale(1);font:700 clamp(15px,2.2vw,20px)/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border:3px solid currentColor;border-radius:6px;background:var(--panel);white-space:nowrap;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.stamp.bad{color:var(--wrong)} .stamp.good{color:var(--right)}
.stamp.off{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(1.8)}

.sec-l{font:600 10px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.pool{padding:10px 12px 0}
.pool .sec-l{display:flex;justify-content:space-between;margin-bottom:5px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{position:relative;margin:0;aspect-ratio:193/142;border:2px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel-2);transition:border-color .25s}
.slot img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.slot.seen img{opacity:1}
.slot.ghost img{opacity:.35}
.slot .id{position:absolute;left:3px;top:3px;font:700 10px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;background:var(--panel);color:var(--ink);padding:2px 4px;border-radius:3px}
.slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 10px/1.1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--muted);text-align:center;padding:2px}
.slot.seen .ph{display:none}
.slot.unseen{border-style:dashed}
.slot.asking{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.slot .x{position:absolute;inset:0;opacity:0;transition:opacity .25s}
.slot .x::before,.slot .x::after{content:"";position:absolute;left:50%;top:50%;width:62%;height:5px;margin-left:-31%;margin-top:-2.5px;background:var(--cross);border-radius:3px}
.slot .x::before{transform:rotate(35deg)} .slot .x::after{transform:rotate(-35deg)}
.slot.crossed .x{opacity:1}
.slot .score{position:absolute;right:3px;bottom:3px;font:700 11px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;background:var(--ink);color:var(--panel);padding:2px 4px;border-radius:3px;opacity:0;transition:opacity .2s}
.slot.scored .score{opacity:1}
.slot .pick{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font:700 9.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--ink);padding:2px 4px;border-radius:3px;opacity:0}
.slot.chosen .pick{opacity:1}
.slot.scored.chosen .pick{left:3px;transform:none}
.slot.rev-wrong{border-color:var(--wrong);border-style:solid}
.slot.rev-right{border-color:var(--right);border-style:solid}

.learned{padding:9px 12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:34px}
.learned .sec-l{margin-right:2px}
.chip{font:500 11.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--panel-2);padding:4px 6px;border-radius:4px}
.chip[hidden]{display:none}
.learned .none{font-size:12px;color:var(--muted)}

.chat{margin:9px 12px 0;height:10.2rem;flex:1 0 auto;overflow-y:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:7px;display:flex;flex-direction:column;gap:5px;scrollbar-width:thin}
.msg{max-width:88%;font-size:13px;line-height:1.3;padding:5px 8px;border-radius:8px}
.msg[hidden]{display:none}
.msg.robot{align-self:flex-start;background:var(--bub-robot);border:1px solid var(--line);border-bottom-left-radius:2px}
.msg.robot .who{font:600 9.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--acc);letter-spacing:.06em;display:block;margin-bottom:2px}
.msg.user{align-self:flex-end;background:var(--bub-user);color:var(--bub-user-ink);border-bottom-right-radius:2px}
.msg.user .who{font:600 9.5px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;opacity:.7;letter-spacing:.06em;display:block;margin-bottom:2px;text-align:right}
.msg.user.typing .txt::after{content:"▍";opacity:.6}
.msg .dots{letter-spacing:2px;opacity:.6}
.msg.sys{align-self:center;background:transparent;font:500 11px/1.2 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--muted);padding:2px 4px}
.msg.sys.dec{color:var(--ink);font-weight:600;border:1px solid var(--ink);border-radius:4px}

.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:10px 12px 12px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.counters div{padding:7px 8px;border-left:1px solid var(--line);min-width:0}
.counters div:first-child{border-left:0}
.counters dt{font:600 9.5px/1.15 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.counters dd{margin:3px 0 0;font:600 1.45rem/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.counters dd.bad{color:var(--wrong)} .counters dd.good{color:var(--right)}
.counters dd small{font-size:.55em;font-weight:500;margin-left:4px}

/* summary */
.summary{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.summary h2{margin:0 0 8px;font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.2rem}
.tbl{width:100%;max-width:780px;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-top:1px solid var(--line-2);vertical-align:middle}
.tbl thead th{border-top:0;font:600 10px/1.2 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{font:600 1.05rem/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;text-align:right;width:16%}
.tbl th.n{text-align:right}
.tbl td.r{font:700 12px/1 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.05em;width:17%}
.tbl td.r.bad{color:var(--wrong)} .tbl td.r.good{color:var(--right)}
.tbl .sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:7px;vertical-align:0}
.tbl tr.pending td.n,.tbl tr.pending td.r{color:var(--muted);font-weight:400}
.tbl tr.flash td{animation:flash .9s ease-out}
@keyframes flash{from{background:var(--line-2)}to{background:transparent}}
.foot{margin:12px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.foot b{color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;letter-spacing:.06em}
.foot .bench{border-collapse:collapse;margin:7px 0 8px;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.foot .bench th,.foot .bench td{padding:3px 12px 3px 0;text-align:left;font-weight:400;color:var(--muted)}
.foot .bench thead th{font-size:10.5px;letter-spacing:.04em}
.foot .bench .v{text-align:right;color:var(--ink);white-space:nowrap}
.foot .bench thead .v{color:var(--muted)}
.foot .bench td:last-child{color:var(--l3);font-weight:600}

function go(L,t,names,dwell){
  var last = L.keys[L.keys.length-1];
  if (t > last[0]) L.keys.push([t,last[1],last[2]]);
  var px = last[1], py = last[2];
  names.forEach(function(n){
    var p = PT[n], d = Math.hypot(p[0]-px,p[1]-py);
    if (d > 0.01){ t += d/SPEED; L.keys.push([t,p[0],p[1]]); }
    px = p[0]; py = p[1];
    if (n.charAt(0)==="s"){
      var id = n.charAt(1);
      if (L.detect[id]==null) L.detect[id]=t;
      if (dwell){ t += dwell; L.keys.push([t,px,py]); }
    }
  });
  return t;
}

  }).join("");
  return '<svg class="map" viewBox="0 0 300 200" role="img" aria-label="Top-down house map: two bathrooms on the left, a hall in the middle, two bedrooms on the right. Cabinet A in the upper bathroom, C in the lower bathroom, B and D in the bedrooms.">'+
    '<rect class="fl-bath" x="8" y="8" width="92" height="184"/>'+ tiles +
    '<rect class="fl-hall" x="100" y="8" width="100" height="184"/>'+
    '<rect class="fl-bed" x="200" y="8" width="92" height="184"/>'+
    /* furniture */
    '<rect class="furn" x="13" y="60" width="24" height="34" rx="7"/><rect class="furn2" x="16" y="63" width="18" height="28" rx="5"/>'+
    '<rect class="furn" x="13" y="106" width="24" height="34" rx="7"/><rect class="furn2" x="16" y="109" width="18" height="28" rx="5"/>'+
    '<rect class="furn" x="78" y="80" width="14" height="14" rx="5"/>'+
    '<rect class="furn" x="78" y="106" width="14" height="14" rx="5"/>'+
    '<rect class="furn" x="232" y="58" width="54" height="36" rx="2"/><rect class="furn2" x="272" y="61" width="11" height="30" rx="2"/>'+
    '<rect class="furn" x="232" y="106" width="54" height="36" rx="2"/><rect class="furn2" x="272" y="109" width="11" height="30" rx="2"/>'+
    '<rect class="furn2" x="125" y="76" width="50" height="48" rx="3"/>'+
    '<rect class="dock" x="142" y="92" width="16" height="16" rx="2"/>'+
    '<rect class="mirror" x="33" y="9.6" width="24" height="2"/><rect class="mirror" x="33" y="188.4" width="24" height="2"/>'+
    '<text class="rl" x="94" y="72" text-anchor="end">BATH</text>'+
    '<text class="rl" x="94" y="134" text-anchor="end">BATH 2</text>'+
    '<text class="rl" x="150" y="22" text-anchor="middle">HALL</text>'+
    '<text class="rl" x="206" y="80">BED</text>'+
    '<text class="rl" x="206" y="126">BED 2</text>'+
    '<path class="wall" d="M8 8H292V192H8Z M100 8V40 M100 60V140 M100 160V192 M200 8V40 M200 60V140 M200 160V192 M8 100H100 M200 100H292"/>'+
    cabs +
    '<polyline class="trail" points=""/>'+
    '<g class="bot"><circle r="6.5"/><path d="M2 -2.6 L6 0 L2 2.6Z"/></g>'+
  '</svg>';
}

/* ---------- build lanes ---------- */
var lanesEl = document.getElementById("lanes");
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
LANES.forEach(function(L){
  var art = document.createElement("article");
  art.className = "lane";
  art.style.setProperty("--acc","var("+L.acc+")");
  art.setAttribute("aria-label","Lane "+L.n+": "+L.name);
  var slots = IDS.map(function(id){
    return '<figure class="slot" data-id="'+id+'"><img alt="'+ALT[id]+'" width="193" height="142"><span class="ph">'+L.unseenLabel+'</span><span class="x"></span><span class="id">'+id+'</span><span class="score"></span><span class="pick">Decide</span></figure>';
  }).join("");
  var learned = L.learned.map(function(f){ return '<span class="chip" hidden>'+esc(f[1])+'</span>'; }).join("");
  var msgs = '<div class="msg sys">Request: Find the cabinet.</div>' + L.msgs.map(function(m){
    if (m.who==="robot") return '<div class="msg robot" hidden><span class="who">'+ROBOT_SVG+'ROBOT'+(m.qn?' · Q'+m.qn+' about '+m.about:'')+(m.kind?' · '+m.kind:'')+'</span>'+esc(m.text)+'</div>';
    if (m.who==="user"){ var lv=lastAt(L.mood,(m.end||m.t)+0.05,0);
      return '<div class="msg user" hidden><span class="who"><span class="st">'+["calm","bothered","irritated","annoyed"][lv]+'</span>'+faceSVG(lv)+'</span><span class="txt"></span><span class="dots">•••</span></div>'; }
    return '<div class="msg sys '+m.cls+'" hidden>'+esc(m.text)+'</div>';
  }).join("");
  art.innerHTML =
    '<header class="lane-h"><div><div class="lane-id">SIM-0'+L.n+'</div>'+
      '<h2>'+L.name+' <span class="tag">'+L.tag+'</span></h2><p class="idea">'+L.idea+'</p></div>'+
      '<div class="mood" data-l="0"><span class="who">user</span>'+
        '<svg class="face" viewBox="0 0 24 24" aria-hidden="true"><circle class="bg" cx="12" cy="12" r="10.5"/><circle class="eye" cx="8.6" cy="10.2" r="1.3"/><circle class="eye" cx="15.4" cy="10.2" r="1.3"/><path class="ft brow" d=""/><path class="ft mouth" d=""/></svg>'+
        '<span class="mood-l">calm</span><div class="burst" hidden>Too many questions!</div></div>'+
    '</header>'+
    '<div class="mapbox">'+mapSVG(L.n)+
      '<div class="stamp off '+(L.result.ok?'good':'bad')+'">'+(L.result.ok?'Correct cabinet':'Wrong cabinet')+'</div></div>'+
    '<div class="status"><span class="dot"></span><span class="st-t"></span></div>'+
    '<div class="pool"><div class="sec-l"><span>'+L.poolLabel+'</span><span class="pool-n"></span></div><div class="slots">'+slots+'</div></div>'+
    '<div class="learned"><span class="sec-l">Learned</span>'+learned+'<span class="none">nothing yet</span></div>'+
    '<div class="chat" aria-hidden="true">'+msgs+'</div>'+
    '<dl class="counters"><div><dt>Questions asked</dt><dd class="cq">0</dd></div><div><dt>User words typed</dt><dd class="cw">0</dd></div><div><dt>Decision</dt><dd class="cd">–</dd></div></dl>';
  lanesEl.appendChild(art);
  var $ = function(s){ return art.querySelector(s); }, $$ = function(s){ return Array.prototype.slice.call(art.querySelectorAll(s)); };
  L.el = {art:art, mood:$(".mood"), moodL:$(".mood-l"), mouth:$(".mouth"), brow:$(".brow"), burst:$(".burst"),
    trail:$(".trail"), bot:$(".bot"), stT:$(".st-t"), stamp:$(".stamp"), poolN:$(".pool-n"),
    chips:$$(".chip"), none:$(".none"), chat:$(".chat"), msgs:$$(".msg").slice(1),
    cq:$(".cq"), cw:$(".cw"), cd:$(".cd"), cab:{}, slot:{}, ping:{}};
  IDS.forEach(function(id){
    L.el.cab[id] = art.querySelector('.cab[data-id="'+id+'"]');
    L.el.ping[id] = L.el.cab[id].querySelector(".ping");
    var s = art.querySelector('.slot[data-id="'+id+'"]');
    L.el.slot[id] = s;
    s.querySelector("img").src = IMG[KEY[id]];
  });
  L.el.msgs.forEach(function(d,i){ var m=L.msgs[i]; m.el=d; if(m.who==="user"){ m.txt=d.querySelector(".txt"); m.dots=d.querySelector(".dots"); } });
  L.sig = "";
});

/* ---------- summary rows ---------- */
var sumBody = document.getElementById("sumbody");
if (sumBody) LANES.forEach(function(L){
  var tr = document.createElement("tr");
  tr.className = "pending";
  tr.innerHTML = '<th scope="row" style="--c:var('+L.acc+')"><span class="sw"></span>'+L.name+(L.tag==="ours"?"":' <span class="mono" style="font-size:11px;color:var(--muted)">('+L.tag+')</span>')+'</th>'+
    '<td class="n">'+L.totalQ+'</td><td class="n">'+L.totalW+'</td><td class="r '+(L.result.ok?'good':'bad')+'">'+(L.result.ok?'Correct':'Wrong')+'</td>';
  sumBody.appendChild(tr);
  L.row = tr; L.rowCells = tr.querySelectorAll("td");
  L.rowVals = [String(L.totalQ), String(L.totalW), L.result.ok?"Correct":"Wrong"];
});
var track = document.getElementById("track");
LANES.forEach(function(L){
  var tk = document.createElement("div");
  tk.className = "tick"; tk.style.setProperty("--c","var("+L.acc+")");
  tk.style.left = (100*L.result.t/END)+"%";
  tk.innerHTML = "<span>"+L.n+" done</span>";
  track.appendChild(tk);
});

/* ---------- helpers ---------- */
function set(el,k,v){ var key="_"+k; if (el[key]!==v){ el[key]=v; if(k==="text") el.textContent=v; else el.setAttribute(k,v); } }
function tog(el,c,on){ on=!!on; var key="_c_"+c; if (el[key]!==on){ el[key]=on; el.classList.toggle(c,on); } }
function hide(el,h){ h=!!h; if (el._h!==h){ el._h=h; el.hidden=h; } }
function lastAt(arr,t,def){ var v=def; for (var i=0;i<arr.length;i++){ if (arr[i][0]<=t) v=arr[i][1]; else break; } return v; }
function pose(keys,t){
  var k=keys, n=k.length, ang=null;
  if (t<=k[0][0]) return [k[0][1],k[0][2],0];
  for (var i=1;i<n;i++){
    var a=k[i-1], b=k[i];
    var dx=b[1]-a[1], dy=b[2]-a[2];
    if (dx||dy) ang=Math.atan2(dy,dx);
    if (t<=b[0]){
      var u = b[0]>a[0] ? (t-a[0])/(b[0]-a[0]) : 1;
      u = u<0?0:u>1?1:u;
      return [a[1]+dx*u, a[2]+dy*u, ang==null?0:ang];
    }
  }
  return [k[n-1][1],k[n-1][2],ang==null?0:ang];
}
var MOUTH = ["M7.4 14.2 Q12 18.6 16.6 14.2","M8 15.6 L16 15.6","M7.8 16.6 Q12 13.8 16.2 16.6","M7.4 17.4 Q12 12.2 16.6 17.4"];
var BROW = ["","","M6.8 7.2 L10.2 7.9 M17.2 7.2 L13.8 7.9","M6.6 6.4 L10.4 8.4 M17.4 6.4 L13.6 8.4"];

/* ---------- render ---------- */
function renderLane(L,t){
  var E=L.el, i;
  // robot + trail
  var p = pose(L.keys,t);
  set(E.bot,"transform","translate("+p[0].toFixed(2)+" "+p[1].toFixed(2)+") rotate("+(p[2]*180/Math.PI).toFixed(1)+")");
  var pts=[];
  for (i=0;i<L.keys.length && L.keys[i][0]<=t;i++) pts.push(L.keys[i][1]+","+L.keys[i][2]);
  pts.push(p[0].toFixed(1)+","+p[1].toFixed(1));
  set(E.trail,"points",pts.join(" "));
  // candidates
  var crossed={}, scored={};
  L.cross.forEach(function(c){ if (c[0]<=t) c[1].forEach(function(id){crossed[id]=1;}); });
  L.scores.forEach(function(s){ if (s[0]<=t) scored[s[1]]=s[2]; });
  var asking=null;
  L.ask.forEach(function(a){ if (t>=a[1] && t<a[2]) asking=a[0]; });
  var decided = L.decide && t>=L.decide.t, done = t>=L.result.t;
  var seenN=0;
  IDS.forEach(function(id){
    var dt = L.detect[id], seen = dt!=null && t>=dt;
    if (seen) seenN++;
    var cab=E.cab[id], sl=E.slot[id];
    var chosen = decided && L.decide.id===id;
    tog(cab,"found",seen); tog(cab,"crossed",!!crossed[id]); tog(cab,"chosen",chosen);
    tog(cab,"rev-right",done && id===TARGET); tog(cab,"rev-wrong",done && chosen && id!==TARGET);
    var ping=E.ping[id];
    if (seen && t-dt<0.9){ var u=(t-dt)/0.9; set(ping,"r",(8+22*u).toFixed(1)); set(ping,"opacity",(1-u).toFixed(2)); }
    else set(ping,"opacity","0");
    tog(sl,"seen",seen); tog(sl,"unseen",!seen); tog(sl,"ghost",!seen && done);
    tog(sl,"crossed",!!crossed[id]); tog(sl,"asking",asking===id);
    tog(sl,"scored",scored[id]!=null); if (scored[id]!=null) set(sl.querySelector(".score"),"text",scored[id]);
    tog(sl,"chosen",chosen);
    tog(sl,"rev-right",done && id===TARGET); tog(sl,"rev-wrong",done && id!==TARGET);
    if (!seen && done) set(sl.querySelector(".ph"),"text","never seen");
    else set(sl.querySelector(".ph"),"text",L.unseenLabel);
  });
  set(E.poolN,"text",seenN+" / 4");
  // learned
  var anyL=false;
  L.learned.forEach(function(f,k){ var on=t>=f[0]; anyL=anyL||on; hide(E.chips[k],!on); });
  hide(E.none,anyL);
  // chat + counters
  var q=0, w=0, sig="";
  L.msgs.forEach(function(m){
    var vis = t>=m.t;
    hide(m.el,!vis);
    if (!vis) return;
    if (m.q) q++;
    if (m.who==="user"){
      var tt=t-m.t-DOTS, nch = tt<0?0:Math.min(m.text.length,Math.floor(tt/TYPE)+1);
      if (tt<0) nch=0;
      var s=m.text.slice(0,nch);
      set(m.txt,"text",s); hide(m.dots,nch>0); tog(m.el,"typing",nch>0 && nch<m.text.length);
      w+=words(s); sig+=nch+",";
    } else sig+="m,";
  });
  if (sig!==L.sig){ L.sig=sig; E.chat.scrollTop=E.chat.scrollHeight; }
  set(E.cq,"text",String(q)); set(E.cw,"text",String(w));
  set(E.cd,"text",decided?L.decide.id:"–");
  tog(E.cd,"bad",done && !L.result.ok); tog(E.cd,"good",done && L.result.ok);
  // mood
  var lv = lastAt(L.mood,t,0);
  set(E.mood,"data-l",String(lv)); set(E.moodL,"text",MOOD[lv]);
  set(E.mouth,"d",MOUTH[lv]); set(E.brow,"d",BROW[lv]);
  hide(E.burst,!(L.burst && t>=L.burst[0] && t<L.burst[1]));
  // status + stamp
  set(E.stT,"text",lastAt(L.status,t,""));
  tog(E.stamp,"off",!done);
  tog(E.art,"live",!done);
  // summary row (removed from the page; kept for older copies)
  if (L.row) {
  tog(L.row,"pending",!done);
  if (done && !L.row._done){ L.row._done=true; L.row.classList.remove("flash"); void L.row.offsetWidth; L.row.classList.add("flash"); }
  if (!done) L.row._done=false;
  for (i=0;i<3;i++) set(L.rowCells[i],"text",done?L.rowVals[i]:"…");
  }
}

var clockEl=document.getElementById("clock"), fillEl=document.getElementById("fill");
var phaseEls=Array.prototype.slice.call(document.querySelectorAll(".phase"));
function render(t){
  LANES.forEach(function(L){ renderLane(L,t); });
  set(clockEl,"text",t.toFixed(1));
  fillEl.style.width=(100*Math.min(1,t/END)).toFixed(2)+"%";
  var ph = t<PH[0]?0:t<PH[1]?1:t<PH[2]?2:3;
  phaseEls.forEach(function(el,k){ tog(el,"on",k===ph); });
}

/* ---------- playback ---------- */
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var t = reduce ? END-0.01 : 0, playing = !reduce, speed = 1, last = null;
// pace as in the oral deck: 2x while the robots explore, 1.3x once the pooled robots start asking the user
function firstAsk(L){ for (var i=0;i<L.msgs.length;i++) if (L.msgs[i].who==="robot") return L.msgs[i].t; return END; }
var TALK = Math.min(firstAsk(L2), firstAsk(L3));
function pace(x){ return x < TALK ? 2 : 1.3; }
var playBtn=document.getElementById("play"), rsBtn=document.getElementById("restart");
var spBtns=Array.prototype.slice.call(document.querySelectorAll(".spd button"));
function syncBtn(){ playBtn.textContent = playing?"Pause":"Play"; }
playBtn.addEventListener("click",function(){
  playing=!playing;
  if (playing && t>=END-0.02) t=0;
  last=null; syncBtn();
});
rsBtn.addEventListener("click",function(){ t=0; playing=true; last=null; syncBtn(); render(t); });
// speed buttons scale the deck pace above (0.5x - 2x)
spBtns.forEach(function(b){ b.addEventListener("click",function(){
  speed=parseFloat(b.getAttribute("data-s"));
  spBtns.forEach(function(o){ o.setAttribute("aria-pressed",o===b?"true":"false"); });
}); });
function frame(now){
  if (playing){
    if (last!=null){
      var dt=Math.min(0.1,(now-last)/1000)*speed*pace(t);
      t+=dt;
      if (t>=END){
        if (reduce){ t=END-0.01; playing=false; syncBtn(); }
        else t=0;
      }
    }
    last=now;
    render(t);
  } else last=null;
  requestAnimationFrame(frame);
}
syncBtn();
render(t);
requestAnimationFrame(frame);
})();
</script>
